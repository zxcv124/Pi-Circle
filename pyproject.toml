[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-circle"
version = "0.1.0"
description = "Pi-Circle — family network command GUI powered by Pi-hole (by Yahya @914ix)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Pi-Circle Attribution Non-Enterprise License (see LICENSE)" }
authors = [
  { name = "Yahya" }
]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn[standard]>=0.30,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9"
]

[project.scripts]
pi-circle-agent = "pi_circle.agent:main"
pi-circle-dashboard = "pi_circle.dashboard:main"
pi-circlectl = "pi_circle.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
